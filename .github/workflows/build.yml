name: build

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test presentation metadata and pickup queue
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build release DLL
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/EldenRingLorePickup.dll dist/EldenRingLorePickup.dll
          Copy-Item README.md dist/README.md
          Copy-Item LorePickup.me3.example dist/LorePickup.me3.example
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

      - name: Fetch inventory artwork
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/elden-ring-playground/elden-ring-media.git icon-source
          git -C icon-source sparse-checkout set menu/low/00_solo

      - name: Build compact icon bundle
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build_icon_bundle.py icon-source/menu/low/00_solo dist/EldenRingLorePickup-icons

      - name: Package release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath EldenRingLorePickup-v0.8.2.zip

      - name: Upload test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-v0.8.2
          path: EldenRingLorePickup-v0.8.2.zip

      - name: Publish v0.8.2 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.2
          target_commitish: ${{ github.sha }}
          name: LorePickup v0.8.2 — Per-item presentation flags
          prerelease: true
          body: |
            Removes the HUD-state gate entirely. The v0.8.1 log proved Hud(3) remains active while Y/OK item panels are visible.

            Classifies each pickup using the two presentation bytes observed in the supplied logs: the NEW-item flag or the forced-panel flag. This covers existing Kukri, NEW Exile Gauntlets, Stalwart Horn Charm and all three Cracked Tears; ordinary unflagged pickups are filtered separately, even while cards are queued. Dirty padding bytes do not count as a flag.

            Cards queue immediately and remain until Y. The old 1.5-second candidate expiration and 90-second reading limit are gone. Three qualifying pickups create an ordered three-card deck. Holding Y cannot skip the next card.

            Validation: automated tests against recorded metadata values and queue/input scenarios, plus a Windows build. This is a prerelease: the flag interpretation is inferred from the supplied traces and has not been verified in-game after this change. Dismissal observes controller Y, not the actual panel-close event; keyboard/remapped input and closure by death/loading are not synchronized.

            Close the game, replace EldenRingLorePickup.dll, keep the icons and .me3 entry, then relaunch. The modern appearance and information rows are unchanged.
          files: EldenRingLorePickup-v0.8.2.zip
          fail_on_unmatched_files: true

      - name: Upload DLL-only PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-${{ github.sha }}
          path: dist/
