name: build

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release DLL
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/EldenRingLorePickup.dll dist/EldenRingLorePickup.dll
          Copy-Item assets/EldenRingLorePickup-card.png dist/EldenRingLorePickup-card.png
          Copy-Item README.md dist/README.md
          Copy-Item LorePickup.me3.example dist/LorePickup.me3.example
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

      - name: Fetch inventory artwork
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/elden-ring-playground/elden-ring-media.git icon-source
          git -C icon-source sparse-checkout set menu/low/00_solo

      - name: Build compact icon bundle
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build_icon_bundle.py icon-source/menu/low/00_solo dist/EldenRingLorePickup-icons

      - name: Package release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath EldenRingLorePickup-v0.6.3.zip

      - name: Upload test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-v0.6.3
          path: EldenRingLorePickup-v0.6.3.zip

      - name: Publish v0.6.3 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.3
          target_commitish: ${{ github.sha }}
          name: LorePickup v0.6.3 — Correct Save-Backed New-Item Detection
          body: |
            Corrective release for v0.6.2's missing cards. The supplied log proved that the DLL loaded and staged Radahn's Great Rune, Ash of War: Golden Slam and Icon Shield, but the live GDI capture could not see the HDR game surface and every candidate expired.

            The log also exposed the underlying inventory bug: `PlayerGameData + 0x5D0` contains a pointer to `EquipInventoryData`, while v0.6.1/v0.6.2 treated that field's address as the inventory itself. v0.6.3 follows the pointer correctly and compares the game's save-backed inventory before and after AddItem. A card is admitted only for an absent-to-present row. The inventory UI's separate `isNew` flag is logged but is not trusted by itself, so repeat stack pickups are rejected without using screen capture.

            Cards remain readable for up to 30 seconds and dismiss on a fresh controller Y press after the pickup button has been released. Multiple new items form a visible deck and advance in order. The presentation now uses a lighter hand-aged vellum surface with dark sepia ink, consistent paragraph spacing and a smooth fade without the coarse particle effect.

            The full icon bundle is included. Cards retain live weapon requirements, affinity, base attack and Ash of War, armour/talisman guidance and ingredient recipe outputs. Whetblades now explain exactly which affinities they unlock and which stats those affinities favour, including Poison/Blood/Occult guidance for the Black Whetblade.

            Extract the DLL, `EldenRingLorePickup-card.png`, and the complete `EldenRingLorePickup-icons` folder into `profiles/natives/EldenRingLorePickup/`. The `.me3` profile does not need to change if it already points to `natives/EldenRingLorePickup/EldenRingLorePickup.dll`.
          files: EldenRingLorePickup-v0.6.3.zip
          fail_on_unmatched_files: true

      - name: Upload DLL-only PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-${{ github.sha }}
          path: dist/
