name: build

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release DLL
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/EldenRingLorePickup.dll dist/EldenRingLorePickup.dll
          Copy-Item README.md dist/README.md
          Copy-Item LorePickup.me3.example dist/LorePickup.me3.example
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

      - name: Fetch inventory artwork
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/elden-ring-playground/elden-ring-media.git icon-source
          git -C icon-source sparse-checkout set menu/low/00_solo

      - name: Build compact icon bundle
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build_icon_bundle.py icon-source/menu/low/00_solo dist/EldenRingLorePickup-icons

      - name: Package release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath EldenRingLorePickup-v0.8.0.zip

      - name: Upload test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-v0.8.0
          path: EldenRingLorePickup-v0.8.0.zip

      - name: Publish v0.8.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.0
          target_commitish: ${{ github.sha }}
          name: LorePickup v0.8.0 — Game-State Trigger and Modern UI
          body: |
            v0.8.0 replaces the parchment/card-art experiment with a compact modern interface: a translucent charcoal panel, fully opaque Segoe UI text and inventory icon, consistently spaced lore paragraphs, aligned information rows and an unmistakable offset stack when several cards are waiting. Dismissal is now a clean 160 ms fade with no simulated particles.

            More importantly, the trigger has been rebuilt. The item presentation hook now creates only a short-lived candidate. LorePickup promotes it only while Elden Ring's own frontend manager reports the blocking PopupMenu HUD state used by the large Y/OK item panel. Ordinary pickups that produce only the small right-side log remain in the Default state and are discarded. Repeat items still qualify whenever the game itself presents the blocking panel.

            The same Y press dismisses both displays. The next stacked card is protected until Y is released, so a held press cannot skip multiple cards. Cards also close when the game panel closes and include a 90-second safety timeout.

            Weapon rows now prioritise affinity, requirements, base damage and skill, followed by likely build use; defensive resistances are intentionally omitted. Ingredients retain live recipe outputs, Whetblades retain affinity/stat guidance, and the complete icon bundle is included.

            Existing users only need to replace `EldenRingLorePickup.dll`. Keep the icon folder and the existing `.me3` entry. The old `EldenRingLorePickup-card.png` is no longer read and can be deleted.
          files: EldenRingLorePickup-v0.8.0.zip
          fail_on_unmatched_files: true

      - name: Upload DLL-only PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-${{ github.sha }}
          path: dist/
