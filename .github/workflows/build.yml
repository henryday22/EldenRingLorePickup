name: build

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test frontend probe and pickup queue
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build release DLL
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/EldenRingLorePickup.dll dist/EldenRingLorePickup.dll
          Copy-Item README.md dist/README.md
          Copy-Item LorePickup.me3.example dist/LorePickup.me3.example
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

      - name: Fetch inventory artwork
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/elden-ring-playground/elden-ring-media.git icon-source
          git -C icon-source sparse-checkout set menu/low/00_solo

      - name: Build compact icon bundle
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build_icon_bundle.py icon-source/menu/low/00_solo dist/EldenRingLorePickup-icons

      - name: Package release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath EldenRingLorePickup-v0.8.1.zip

      - name: Upload test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-v0.8.1
          path: EldenRingLorePickup-v0.8.1.zip

      - name: Publish v0.8.1 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.1
          target_commitish: ${{ github.sha }}
          name: LorePickup v0.8.1 — Correct 1.17 frontend address
          prerelease: true
          body: |
            Fixes the confirmed v0.8.0 address bug: the 1.17 runtime was using the 1.16 CSFeMan singleton fallback. Kukri and Exile Gauntlets were captured correctly, then discarded by the unreadable popup probe.

            Uses the version-specific frontend address, verifies the CSFeManImp vtable before reading its HUD state, and safely reads memory through Windows. Logs now distinguish an unavailable probe from a closed popup instead of calling every missed candidate a routine pickup.

            Validation: automated memory-probe and queue tests and a Windows release build. This is a prerelease pending an in-game check; the general HUD-state gate is still used. No claim is made that every item panel and dismissal case is already verified.

            Close Elden Ring, replace EldenRingLorePickup.dll, retain the icon folder and existing .me3 entry, and relaunch. The modern UI is unchanged. Check one Y/OK item panel and one ordinary small-log pickup; if either behaves incorrectly, the new log contains the probe state needed to distinguish the remaining cause.
          files: EldenRingLorePickup-v0.8.1.zip
          fail_on_unmatched_files: true

      - name: Upload DLL-only PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-${{ github.sha }}
          path: dist/
