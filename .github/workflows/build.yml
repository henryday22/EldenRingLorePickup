name: build

permissions:
  contents: write

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release DLL
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/EldenRingLorePickup.dll dist/EldenRingLorePickup.dll
          Copy-Item assets/EldenRingLorePickup-card.png dist/EldenRingLorePickup-card.png
          Copy-Item README.md dist/README.md
          Copy-Item LorePickup.me3.example dist/LorePickup.me3.example
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

      - name: Fetch inventory artwork
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/elden-ring-playground/elden-ring-media.git icon-source
          git -C icon-source sparse-checkout set menu/low/00_solo

      - name: Build compact icon bundle
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build_icon_bundle.py icon-source/menu/low/00_solo dist/EldenRingLorePickup-icons

      - name: Package release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath EldenRingLorePickup-v0.7.0.zip

      - name: Upload test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-v0.7.0
          path: EldenRingLorePickup-v0.7.0.zip

      - name: Publish v0.7.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0
          target_commitish: ${{ github.sha }}
          name: LorePickup v0.7.0 — Exact Y-Panel Trigger and Rebuilt Card
          body: |
            This revision replaces all inferred pickup gating with a direct hook into Elden Ring's large item-panel function. If the game opens the panel that must be dismissed with Y/OK, LorePickup receives the same item ID and opens a card. This includes panels for repeat or otherwise non-new items such as Soft Cotton. Small right-side pickup logs do not call this function and remain ignored.

            The item-panel address is found by a checked executable signature and the mod remains inert if it cannot be resolved uniquely. Inventory state and HDR-sensitive screen capture are no longer used to decide whether a card should appear.

            The card artwork has been rebuilt as a larger and wider smoke-darkened vellum object with restrained damaged gold leaf. Typography is now ivory and muted gold, with more room for the title and lore. The old plain fade is replaced by a 920 ms field of 480 individually drawn tiny rune motes and short gold trails; there are no scaled particle sprites or coarse blocks. Only the moving foreground is repainted during dismissal to protect the game image from transparency flicker.

            The full icon bundle is included. Cards retain live weapon requirements, affinity, base attack and Ash of War, armour/talisman guidance and ingredient recipe outputs. Whetblades now explain exactly which affinities they unlock and which stats those affinities favour, including Poison/Blood/Occult guidance for the Black Whetblade.

            Replace both the DLL and `EldenRingLorePickup-card.png` in `profiles/natives/EldenRingLorePickup/`. The icon folder and `.me3` profile do not need to change.
          files: EldenRingLorePickup-v0.7.0.zip
          fail_on_unmatched_files: true

      - name: Upload DLL-only PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-${{ github.sha }}
          path: dist/
