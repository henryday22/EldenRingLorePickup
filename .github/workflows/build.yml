name: build

permissions:
  contents: write

on:
  push:
    branches: ["main", "v0.10.0-preview"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test pickup queue, details and Windows rendering
        env:
          LOREPICKUP_PREVIEW_DIR: previews
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build release DLL
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/EldenRingLorePickup.dll dist/EldenRingLorePickup.dll
          Copy-Item README.md dist/README.md
          Copy-Item "Open Lore Journal.cmd" "dist/Open Lore Journal.cmd"
          Copy-Item LorePickup.me3.example dist/LorePickup.me3.example
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

      - name: Fetch inventory artwork
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/elden-ring-playground/elden-ring-media.git icon-source
          git -C icon-source sparse-checkout set menu/low/00_solo

      - name: Build compact icon bundle
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build_icon_bundle.py icon-source/menu/low/00_solo dist/EldenRingLorePickup-icons

      - name: Export renderer previews
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; from pathlib import Path; [Image.open(p).convert('RGB').save(p.with_suffix('.png')) for p in Path('previews').glob('*.bmp')]"

      - name: Upload renderer previews
        uses: actions/upload-artifact@v4
        with:
          name: LorePickup-renderer-previews
          path: previews/*.png

      - name: Package release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath EldenRingLorePickup-v0.10.0.zip

      - name: Upload test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-v0.10.0
          path: EldenRingLorePickup-v0.10.0.zip

      - name: Publish v0.10.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.0
          target_commitish: ${{ github.sha }}
          name: LorePickup v0.10.0 — Practical recipes and character collections
          prerelease: true
          body: |
            Adds recipe explanations, character-aware requirement checks and a persistent local collection journal. Keeps the working pickup classification, Y dismissal and stacked deck.

            Ingredients now explain why to keep them, what finished items do, all material quantities and recipe-unlock requirements. Reusable pot/perfume containers are resolved from live pot groups. Crafted consumables also show their recipe. Exact cookbook names, cookbook ownership and inventory availability are not yet resolved.

            Weapons retain relevant damage, affinity, scaling and skill information, and add coating compatibility and a base-attribute requirement check for the current character. Spells add requirements, FP and memory slots; spirits show summon costs. Practical effect/context notes also cover other supported item types. Facts are read from the game; prose is authored rule-based guidance, not invented lore.

            The fixed card footer shows X/Y collected. Open Lore Journal.cmd opens a searchable offline journal with separate character collections. Repeat pickups still show cards but do not inflate progress; reinforcement/affinity variants share a collection entry. Progress starts with this version; existing inventory is not backfilled. The denominator is the supported named catalogue plus recorded discoveries, not a verified obtainable-items total.

            Automatic character context is limited to the validated 1.17-era address layout. If the footer says collection is paused, set a unique profile name in the generated LorePickup.ini beside the DLL and restart. Full profile, storage and count details are in README.md. No game save is edited.

            Validation: regression/unit tests, a Windows release build and actual GDI renderer previews. New live recipe and character reads still require in-game verification.

            Installation: close the game, replace the DLL and copy Open Lore Journal.cmd from the archive. Keep the icons folder, existing LorePickup.ini and .me3 entry, then relaunch.
          files: EldenRingLorePickup-v0.10.0.zip
          fail_on_unmatched_files: true

      - name: Upload DLL-only PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-${{ github.sha }}
          path: dist/
