name: build

permissions:
  contents: write

on:
  push:
    branches: ["main", "v0.9.0-preview"]
  pull_request:
  workflow_dispatch:

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test pickup queue, details and Windows rendering
        env:
          LOREPICKUP_PREVIEW_DIR: previews
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build release DLL
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/EldenRingLorePickup.dll dist/EldenRingLorePickup.dll
          Copy-Item README.md dist/README.md
          Copy-Item LorePickup.me3.example dist/LorePickup.me3.example
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md

      - name: Fetch inventory artwork
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/elden-ring-playground/elden-ring-media.git icon-source
          git -C icon-source sparse-checkout set menu/low/00_solo

      - name: Build compact icon bundle
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/build_icon_bundle.py icon-source/menu/low/00_solo dist/EldenRingLorePickup-icons

      - name: Export renderer previews
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python -c "from PIL import Image; from pathlib import Path; [Image.open(p).convert('RGB').save(p.with_suffix('.png')) for p in Path('previews').glob('*.bmp')]"

      - name: Upload renderer previews
        uses: actions/upload-artifact@v4
        with:
          name: LorePickup-renderer-previews
          path: previews/*.png

      - name: Package release
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath EldenRingLorePickup-v0.9.0.zip

      - name: Upload test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-v0.9.0
          path: EldenRingLorePickup-v0.9.0.zip

      - name: Publish v0.9.0 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0
          target_commitish: ${{ github.sha }}
          name: LorePickup v0.9.0 — Centred cards and practical item notes
          prerelease: true
          body: |
            Keeps the v0.8.2 pickup classification and Y dismissal logic that the user confirmed working.

            Cards now centre vertically using their measured height and the visible stack. Warm charcoal, muted gold-grey rules and ivory serif text replace the blue-grey rounded styling. Uses an installed Agmena face when available, otherwise Garamond/Georgia; this is a visual approximation, not the game's actual UI renderer or a bundled game font.

            Adds practical item notes alongside original lore. Weapons prioritise class, affinity, requirements, reinforcement-adjusted base attack, relative scaling, skill, base status buildup and weight, with class-specific usage advice and two-handed Strength requirements. Casting tools do not mislabel melee damage as spell damage. Materials retain their complete recipe output list. Consumables, spells, summons, upgrade materials, armour and talismans get relevant usage guidance where supported. Notes are authored rules; they are not invented game lore or bespoke essays for every item.

            Long cards keep their font size: LB/RB scroll the text while the title and Y prompt remain visible. These inputs are observed, not intercepted, so the game can also receive them.

            Validation: automated regression tests and actual Windows GDI renderer previews at 864p, 1080p and 1440p, plus the release build. New styling and live parameter reads still require in-game verification.

            Close the game, replace EldenRingLorePickup.dll, keep the icons and .me3 entry, then relaunch. No new artwork or font installation is required.
          files: EldenRingLorePickup-v0.9.0.zip
          fail_on_unmatched_files: true

      - name: Upload DLL-only PR build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: EldenRingLorePickup-${{ github.sha }}
          path: dist/
